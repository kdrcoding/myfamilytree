<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1f1c" />
    <meta
      name="description"
      content="Oq-Ariq OILASI — interaktiv oilaviy shajara sayti. Oq-Ariq family tree website."
    />
    <title>Oq-Ariq OILASI</title>
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
    <style>
      html,
      body {
        margin: 0;
        background: #e4efeb;
      }
      html.dark,
      html.dark body {
        background: #070f0e;
        color: #ecf4f1;
      }
    </style>
    <script>
      // Apply the saved theme before React mounts to avoid a flash of the wrong
      // theme. Dark is the default: the page starts dark unless the visitor has
      // explicitly chosen the light theme.
      (function () {
        try {
          var raw = localStorage.getItem('familytree.settings.v1');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme === null) {
            // First-time visitor: respect OS preference
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            }
          } else if (theme !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
